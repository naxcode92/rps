<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!--
    TEACHING: Viewport meta tag
    This tells mobile browsers how to scale the page.
    - width=device-width: match the screen width
    - initial-scale=1: no zoom on load
    - user-scalable=no: prevent pinch-to-zoom (important for games!)
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

  <!-- Theme color: colors the browser chrome on mobile to match our Game Boy green -->
  <meta name="theme-color" content="#9bbc0f">

  <title>Rock Paper Scissors</title>

  <!--
    TEACHING: Google Fonts with display=swap
    'Press Start 2P' is a pixel/retro font that gives us the Nintendo look.
    display=swap means: show text immediately in a fallback font, then swap
    to the pixel font once it loads. This prevents invisible text (FOIT).
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!--
    TEACHING: data-state attribute
    Instead of toggling classes on every section, we put a SINGLE attribute
    on the wrapper. CSS uses [data-state="xxx"] selectors to show/hide screens.
    JS only needs to change ONE attribute to switch the entire UI.
  -->
  <div id="game-frame" data-state="title">

    <!-- ========== TITLE SCREEN ========== -->
    <section id="screen-title">
      <div class="title-content">
        <h1 class="game-title">
          <span class="title-rock">ROCK</span>
          <span class="title-paper">PAPER</span>
          <span class="title-scissors">SCISSORS</span>
        </h1>
        <p class="title-sub">BATTLE EDITION</p>
        <button id="btn-start" class="btn-retro pulse">PRESS START</button>
      </div>
    </section>

    <!-- ========== PLAYER 1 CHOOSE ========== -->
    <section id="screen-p1-choose">
      <div class="choose-screen">
        <div class="score-bar">
          <div class="hp-group hp-p1">
            <span class="hp-label">P1</span>
            <div class="hp-track"><div class="hp-fill hp-fill-p1"></div></div>
          </div>
          <div class="round-indicator">ROUND <span id="round-num-p1">1</span></div>
          <div class="hp-group hp-p2">
            <span class="hp-label">P2</span>
            <div class="hp-track"><div class="hp-fill hp-fill-p2"></div></div>
          </div>
        </div>

        <div class="player-turn-label p1-color">PLAYER 1</div>
        <div class="turn-sub">Choose your move!</div>

        <!-- 5-second countdown bar -->
        <div class="timer-track">
          <div class="timer-fill" id="timer-p1"></div>
        </div>
        <div class="timer-text" id="timer-text-p1">5</div>

        <div class="choice-buttons">
          <button class="btn-choice" data-choice="rock" data-player="1">
            <span class="choice-emoji">✊</span>
            <span class="choice-label">ROCK</span>
          </button>
          <button class="btn-choice" data-choice="paper" data-player="1">
            <span class="choice-emoji">✋</span>
            <span class="choice-label">PAPER</span>
          </button>
          <button class="btn-choice" data-choice="scissors" data-player="1">
            <span class="choice-emoji">✌️</span>
            <span class="choice-label">SCISSORS</span>
          </button>
        </div>
      </div>
    </section>

    <!-- ========== HANDOFF SCREEN ========== -->
    <section id="screen-handoff">
      <div class="handoff-content">
        <p class="handoff-icon">🔄</p>
        <p class="handoff-text">PASS TO</p>
        <p class="handoff-player p2-color">PLAYER 2</p>
        <button id="btn-ready" class="btn-retro pulse">READY!</button>
      </div>
    </section>

    <!-- ========== PLAYER 2 CHOOSE ========== -->
    <section id="screen-p2-choose">
      <div class="choose-screen">
        <div class="score-bar">
          <div class="hp-group hp-p1">
            <span class="hp-label">P1</span>
            <div class="hp-track"><div class="hp-fill hp-fill-p1"></div></div>
          </div>
          <div class="round-indicator">ROUND <span id="round-num-p2">1</span></div>
          <div class="hp-group hp-p2">
            <span class="hp-label">P2</span>
            <div class="hp-track"><div class="hp-fill hp-fill-p2"></div></div>
          </div>
        </div>

        <div class="player-turn-label p2-color">PLAYER 2</div>
        <div class="turn-sub">Choose your move!</div>

        <div class="timer-track">
          <div class="timer-fill" id="timer-p2"></div>
        </div>
        <div class="timer-text" id="timer-text-p2">5</div>

        <div class="choice-buttons">
          <button class="btn-choice" data-choice="rock" data-player="2">
            <span class="choice-emoji">✊</span>
            <span class="choice-label">ROCK</span>
          </button>
          <button class="btn-choice" data-choice="paper" data-player="2">
            <span class="choice-emoji">✋</span>
            <span class="choice-label">PAPER</span>
          </button>
          <button class="btn-choice" data-choice="scissors" data-player="2">
            <span class="choice-emoji">✌️</span>
            <span class="choice-label">SCISSORS</span>
          </button>
        </div>
      </div>
    </section>

    <!-- ========== BATTLE SCREEN ========== -->
    <section id="screen-battle">
      <div class="battle-scene">
        <div class="battle-sprites">
          <div class="sprite-area sprite-p1">
            <div class="sprite-label p1-color">P1</div>
            <div class="sprite-icon" id="sprite-p1">?</div>
          </div>
          <div class="vs-text">VS</div>
          <div class="sprite-area sprite-p2">
            <div class="sprite-label p2-color">P2</div>
            <div class="sprite-icon" id="sprite-p2">?</div>
          </div>
        </div>
        <div class="battle-textbox">
          <p id="battle-text"></p>
        </div>
      </div>
    </section>

    <!-- ========== RESULT SCREEN ========== -->
    <section id="screen-result">
      <div class="result-content">
        <div class="score-bar">
          <div class="hp-group hp-p1">
            <span class="hp-label">P1</span>
            <div class="hp-track"><div class="hp-fill hp-fill-p1"></div></div>
          </div>
          <div class="round-indicator" id="result-round">ROUND 1</div>
          <div class="hp-group hp-p2">
            <span class="hp-label">P2</span>
            <div class="hp-track"><div class="hp-fill hp-fill-p2"></div></div>
          </div>
        </div>

        <div class="result-outcome" id="result-text">DRAW!</div>
        <div class="result-detail" id="result-detail"></div>

        <div class="result-score">
          <span class="p1-color">P1: <span id="score-p1">0</span></span>
          <span> — </span>
          <span class="p2-color">P2: <span id="score-p2">0</span></span>
        </div>

        <button id="btn-next-round" class="btn-retro">NEXT ROUND</button>
      </div>
    </section>

    <!-- ========== GAME OVER SCREEN ========== -->
    <section id="screen-gameover">
      <div class="gameover-content">
        <div class="gameover-icon" id="gameover-icon">🏆</div>
        <div class="gameover-title" id="gameover-title">PLAYER 1 WINS!</div>
        <div class="gameover-score" id="gameover-score">2 — 0</div>
        <button id="btn-play-again" class="btn-retro pulse">PLAY AGAIN</button>
      </div>
    </section>

    <!-- ========== CONTINUE SCREEN ========== -->
    <section id="screen-continue">
      <div class="continue-content">
        <div class="continue-title pulse">CONTINUE?</div>
        <div class="continue-loser" id="continue-loser">PLAYER 1</div>
        <div class="continue-countdown" id="continue-countdown">10</div>
        <button id="btn-continue" class="btn-continue">
          <span class="coin-icon">🪙</span> $1.00 CONTINUE
        </button>
        <p class="continue-hint">Extends to Best of 7!</p>
      </div>
    </section>

  </div>

  <!--
    TEACHING: Script at bottom with defer
    Placing the script at the bottom ensures the DOM is ready.
    We also use defer as a safety net.
  -->
  <script src="game.js" defer></script>
</body>
</html>
